[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsys-decoder"
version = "0.1.0"
description = "Reference Python DSP + CCA decoder for the SynapSys SSVEP BCI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
data = [
    "py7zr>=0.20,<2",  # extracts the Wang Benchmark .mat.7z archives
]
record = [
    "pyserial>=3.5,<4",  # record_serial.py: raw EEG from the ESP32 over USB
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
